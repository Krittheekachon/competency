services:
  db:
    image: postgres:15-alpine
    container_name: competency_postgres
    restart: always
    environment:
      POSTGRES_USER: sail
      POSTGRES_PASSWORD: password
      POSTGRES_DB: competency
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
